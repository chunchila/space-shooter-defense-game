<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>מגן החלל</title><style>*{box-sizing:border-box;margin:0}body{background:#0b1020;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;user-select:none}h1{font-size:22px;margin:12px 0 4px}#hud{display:flex;gap:18px;margin:6px;font-size:18px}canvas{background:#111936;border-radius:12px;max-width:96vw;box-shadow:0 0 30px #4af3}button{background:#38bdf8;border:0;border-radius:10px;padding:10px 20px;font-size:17px;font-weight:700;margin:8px;cursor:pointer}p{opacity:.7;font-size:14px;margin:4px}</style></head><body>
<h1>🚀 מגן החלל</h1><div id="hud"><span>ניקוד: <b id="s">0</b></span><span>חיים: <b id="l">3</b></span><span>גל: <b id="w">1</b></span></div>
<canvas id="c" width="360" height="560"></canvas><p>גררו את הספינה (עכבר/מגע) או חצים · ירי אוטומטי</p><button id="r">התחל מחדש</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let best=+localStorage.spaceBest||0;
let P,bl,en,eb,pw,st,sc,lives,wave,t,over,keys={};
function init(){P={x:180,y:500,inv:0};bl=[];en=[];eb=[];pw=[];sc=0;lives=3;wave=1;t=0;over=false;st=Array.from({length:50},()=>({x:Math.random()*360,y:Math.random()*560,s:Math.random()*2+.5}));hud()}
function hud(){s.textContent=sc;l.textContent=lives;w.textContent=wave}
function spawn(){const n=4+wave*2;for(let i=0;i<n;i++)en.push({x:40+(i%6)*52,y:-30-(i/6|0)*45,hp:wave>3&&i%5==0?3:1,ph:i,vx:1+wave*.15})}
function loop(){t++;x.fillStyle='#070b1c';x.fillRect(0,0,360,560);x.fillStyle='#fff';st.forEach(a=>{a.y=(a.y+a.s)%560;x.fillRect(a.x,a.y,a.s,a.s)});
 if(!over){if(keys.ArrowLeft)P.x-=5;if(keys.ArrowRight)P.x+=5;if(keys.ArrowUp)P.y-=5;if(keys.ArrowDown)P.y+=5;P.x=Math.max(16,Math.min(344,P.x));P.y=Math.max(300,Math.min(540,P.y));
  if(t%12==0){bl.push({x:P.x,y:P.y-18});if(P.tri){bl.push({x:P.x-12,y:P.y-10,dx:-1.5});bl.push({x:P.x+12,y:P.y-10,dx:1.5})}}
  if(!en.length){spawn();wave++;hud()}
  if(P.tri>0)P.tri--;if(P.inv>0)P.inv--}
 bl.forEach(b=>{b.y-=9;b.x+=b.dx||0;x.fillStyle='#4ade80';x.fillRect(b.x-2,b.y,4,12)});bl=bl.filter(b=>b.y>-20);
 en.forEach(e=>{e.y+=e.y<60?1.5:.15+wave*.02;e.x+=Math.sin(t/40+e.ph)*e.vx;if(!over&&Math.random()<.0008*(1+wave*.4))eb.push({x:e.x,y:e.y+14});
  x.fillStyle=e.hp>1?'#a78bfa':'#f87171';x.beginPath();x.moveTo(e.x,e.y+14);x.lineTo(e.x-15,e.y-10);x.lineTo(e.x+15,e.y-10);x.fill();x.fillStyle='#fff';x.fillRect(e.x-4,e.y-6,3,3);x.fillRect(e.x+1,e.y-6,3,3);
  bl.forEach(b=>{if(!b.d&&Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<14){b.d=1;e.hp--;if(e.hp<=0){e.dead=1;sc+=10*wave;if(Math.random()<.12)pw.push({x:e.x,y:e.y});hud()}}});
  if(!over&&!P.inv&&Math.abs(P.x-e.x)<20&&Math.abs(P.y-e.y)<20){e.dead=1;hit()}if(e.y>580){e.dead=1;if(!over){lives--;hud();chk()}}});
 en=en.filter(e=>!e.dead);bl=bl.filter(b=>!b.d);
 eb.forEach(b=>{b.y+=4;x.fillStyle='#fb923c';x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill();if(!over&&!P.inv&&Math.abs(b.x-P.x)<12&&Math.abs(b.y-P.y)<14){b.d=1;hit()}});eb=eb.filter(b=>b.y<580&&!b.d);
 pw.forEach(p=>{p.y+=2;x.fillStyle='#fde047';x.fillText('★',p.x-6,p.y);if(Math.abs(p.x-P.x)<18&&Math.abs(p.y-P.y)<18){p.d=1;P.tri=500}});pw=pw.filter(p=>p.y<580&&!p.d);
 if(!over&&(P.inv%8<4)){x.fillStyle='#38bdf8';x.beginPath();x.moveTo(P.x,P.y-18);x.lineTo(P.x-15,P.y+14);x.lineTo(P.x,P.y+6);x.lineTo(P.x+15,P.y+14);x.fill();x.fillStyle='#fb923c';x.fillRect(P.x-3,P.y+8,6,4+t%6)}
 if(over){x.fillStyle='#000b';x.fillRect(0,200,360,130);x.fillStyle='#fff';x.font='bold 28px Arial';x.textAlign='center';x.fillText('המשחק נגמר',180,245);x.font='18px Arial';x.fillText('ניקוד '+sc+' · שיא '+best,180,280);x.fillText('לחצו להתחלה מחדש',180,310)}
 requestAnimationFrame(loop)}
function hit(){lives--;P.inv=90;hud();chk()}
function chk(){if(lives<=0){over=true;if(sc>best){best=sc;localStorage.spaceBest=best}}}
function mv(e){const r=c.getBoundingClientRect();P.x=(e.clientX-r.left)*360/r.width;P.y=(e.clientY-r.top)*560/r.height-40}
c.addEventListener('pointermove',e=>{if(!over)mv(e)});c.addEventListener('pointerdown',e=>{if(over)init();else mv(e)});c.style.touchAction='none';
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=0);r.onclick=init;init();loop();
</script></body></html>
